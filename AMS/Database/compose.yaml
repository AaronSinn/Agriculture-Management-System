services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: AaronSinn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: AMS
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - 5432:5432
 
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: aaron.sinn@me.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - 5050:80

volumes:
  pgdata: